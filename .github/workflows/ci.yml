name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI never calls paid model APIs: no provider keys are configured here, and
# tests use fakes or recorded fixtures.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (without the torch-based embed group)
        run: uv sync --locked --no-group embed
      - name: Secret scan
        run: python3 scripts/check_secrets.py --all
      - name: Ruff
        run: |
          uv run --no-group embed ruff check .
          uv run --no-group embed ruff format --check .
      - name: Mypy
        run: uv run --no-group embed mypy api/src eval/src scripts/check_secrets.py
      - name: Unit tests
        run: uv run --no-group embed pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-group embed
      - name: Integration tests (migrations, ingestion, retrieval on pgvector)
        run: uv run --no-group embed pytest -m integration

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
