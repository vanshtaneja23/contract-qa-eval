services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contractqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contractqa}
      POSTGRES_DB: ${POSTGRES_DB:-contractqa}
    ports:
      # 5434 on the host: 5432/5433 are often taken by other local Postgres instances.
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
