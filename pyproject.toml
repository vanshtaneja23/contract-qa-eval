# uv workspace root. Members: api (the product), eval (CUAD + benchmarks).
# One lockfile (uv.lock) pins every Python dependency for both.
[tool.uv.workspace]
members = ["api", "eval"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
]
# Local embedding models (pulls in torch). On by default locally; CI runs with
# --no-group embed because tests use a fake embedder.
embed = ["sentence-transformers>=3.3"]

[tool.uv]
default-groups = ["dev", "embed"]

[tool.pytest.ini_options]
testpaths = ["scripts", "api/tests", "eval/tests"]
pythonpath = ["scripts", "api/src", "eval/src"]
markers = ["integration: needs Docker (Testcontainers Postgres+pgvector)"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["contract_qa", "contract_eval", "check_secrets"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "snowballstemmer.*", "testcontainers.*", "pgvector.*"]
ignore_missing_imports = true
